name: Node.js imports

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-imports:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test:node
